name: WETU Integration QA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  integration-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
