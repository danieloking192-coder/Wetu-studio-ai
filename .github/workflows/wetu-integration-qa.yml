name: WETU Integration QA
# Runtime verification: project-scoped character/world payload fix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wetu-integration-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Prepare deterministic adaptive package
        run: |
          mkdir -p media/test
          ffmpeg -y -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=1000:sample_rate=48000 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k media/test/master.mp4
          python media-transcoding/transcode_contract.py media/test/master.mp4 --output-dir media/test/renditions --manifest media/test/renditions/manifest.json
          python media-transcoding/package_adaptive.py media/test/renditions media/test/adaptive
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Live Creator runtime smoke test
        env:
          PYTHONPATH: src
          WETU_STATE_DIR: /tmp/wetu-state/projects
          WETU_PROJECT_INDEX: /tmp/wetu-state/projects.json
          WETU_STATE_FILE: /tmp/wetu-state/projects/demo.json
        run: |
          mkdir -p /tmp/wetu-state/projects
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request

          env = os.environ.copy()
          proc = subprocess.Popen(["python", "run_creator.py"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, env=env)
          try:
              base = "http://127.0.0.1:8787"
              for _ in range(30):
                  try:
                      with urllib.request.urlopen(base + "/", timeout=2) as r:
                          assert r.status == 200
                          break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError("Creator server did not start")

              def get(path):
                  with urllib.request.urlopen(base + path, timeout=5) as r:
                      assert r.status == 200, (path, r.status)
                      return r.read()

              def post(path, payload):
                  raw = json.dumps(payload).encode()
                  req = urllib.request.Request(base + path, data=raw,
                      headers={"Content-Type": "application/json"}, method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=5) as r:
                          assert r.status in (200, 201, 202), (path, r.status)
                          return json.loads(r.read())
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", errors="replace")
                      raise RuntimeError(f"{path} returned HTTP {exc.code}: {detail}") from exc

              assert b"WETU Studio" in get("/")
              assert b'"display": "standalone"' in get("/manifest.webmanifest")
              assert b'addEventListener("fetch"' in get("/sw.js")

              assert post("/api/projects/create", {"project_id":"smoke","title":"WETU Runtime Smoke"})["ok"]
              assert post("/api/characters", {"project_id":"smoke","character_id":"amina","name":"Amina","face":{"identity":"persistent"},"wardrobe":{"outfit":"blue dress"},"traits":["calm","determined"]})["ok"]
              assert post("/api/worlds", {"project_id":"smoke","world_id":"kinshasa","name":"Kinshasa","geography":{"city":"Kinshasa"},"architecture":{"style":"urban"},"landmarks":["city streets"]})["ok"]
              assert post("/api/scenes", {"project_id":"smoke","scene_id":"scene-01","sequence":1,"character_ids":["amina"],"world_id":"kinshasa","language":"fr","state":{"shot":"wide cinematic"}})["ok"]

              generation = post("/api/generate", {"project_id":"smoke","scene_id":"scene-01","provider":"wetu-demo","kind":"image","prompt":"A cinematic street scene in Kinshasa with Amina.","generation_id":"gen-smoke"})
              assert generation.get("status") in ("completed","qa_passed"), generation
              assert generation.get("qa", {}).get("passed") is True, generation

              usage = json.loads(get("/api/usage"))
              assert usage["usage"]["plan"] == "FREE"
              media = post("/api/media-generate", {"request_id":"media-smoke","project_id":"smoke","kind":"image","prompt":"smoke"})
              assert media["ok"] is True, media
              assert media["usage"]["month_units_used"] == 1, media
              export = post("/api/postproduction/export", {"project_id":"smoke","timeline":[{"item_id":"t1","kind":"video","asset_id":"media-smoke","start_ms":0,"end_ms":1000}],"delivery_profiles":["mobile_saver"]})
              assert export["ok"] is True, export
              state = json.loads(get("/api/state"))
              assert state["project_id"] == "smoke"
              assert len(state["characters"]) == 1
              assert len(state["worlds"]) == 1
              assert len(state["scenes"]) == 1
              assert len(state["generations"]) == 1
              print("WETU LIVE CREATOR RUNTIME SMOKE: PASS")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
          PY
      - name: QA completion marker
        run: echo "WETU Integration QA completed"
