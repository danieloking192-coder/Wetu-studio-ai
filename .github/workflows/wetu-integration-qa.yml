name: WETU Integration QA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wetu-integration-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: QA completion marker
        run: echo "WETU Integration QA completed"
