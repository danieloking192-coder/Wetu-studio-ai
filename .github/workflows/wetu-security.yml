name: WETU Security Gate
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  security-events: write
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install security tooling
        run: python -m pip install --upgrade pip pip-audit pytest
      - name: Dependency audit
        run: pip-audit --strict .
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo freshclam || true
          clamscan --version
      - name: Test security scanner with fail-closed AV policy
        env:
          PYTHONPATH: src
          WETU_REQUIRE_ANTIVIRUS: "1"
        run: python -m pytest -q tests/test_media_security_stability.py

      - name: Verify ClamAV detects EICAR test signature
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.com
          if clamscan --no-summary /tmp/eicar.com; then
            echo "ERROR: ClamAV did not reject the EICAR test signature"
            exit 1
          fi
          echo "ClamAV correctly rejected the EICAR test signature."
