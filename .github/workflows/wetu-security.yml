name: WETU Security Gate
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  security-events: write
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install security tooling
        run: python -m pip install --upgrade pip pip-audit pytest
      - name: Dependency audit
        run: pip-audit --strict .
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo freshclam || true
          clamscan --version
      - name: Test security scanner
        env:
          PYTHONPATH: src
          WETU_DISABLE_ANTIVIRUS: "1"
        run: python -m pytest -q tests/test_media_security_stability.py
