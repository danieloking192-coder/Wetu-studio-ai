name: adaptive-streaming-contract
on:
  workflow_dispatch:
  push:
    paths:
      - media-transcoding/package_adaptive.py
      - media-transcoding/transcode_contract.py
      - src/wetu_studio/adaptive_streaming.py
      - tests/test_adaptive_streaming.py
      - .github/workflows/adaptive-streaming-contract.yml
      - tests/test_adaptive_package_e2e.py
jobs:
  adaptive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Validate Python
        run: |
          python -m py_compile media-transcoding/transcode_contract.py
          python -m py_compile media-transcoding/package_adaptive.py
          python -m py_compile src/wetu_studio/adaptive_streaming.py
      - name: Run unit tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_adaptive_streaming.py
      - name: Generate deterministic master
        run: |
          mkdir -p media/test
          ffmpeg -y -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=1000:sample_rate=48000 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k media/test/master.mp4
      - name: Build validated renditions
        run: |
          python media-transcoding/transcode_contract.py media/test/master.mp4 --output-dir media/test/renditions --manifest media/test/renditions/manifest.json
      - name: Package HLS and DASH
        run: |
          python media-transcoding/package_adaptive.py media/test/renditions media/test/adaptive
      - name: Verify adaptive package
        run: |
          test -s media/test/adaptive/hls/master.m3u8
          test -s media/test/adaptive/dash/manifest.mpd
          grep -q "mobile_saver/index.m3u8" media/test/adaptive/hls/master.m3u8
          grep -q "mobile/index.m3u8" media/test/adaptive/hls/master.m3u8
          grep -q "standard/index.m3u8" media/test/adaptive/hls/master.m3u8
          grep -q "AdaptationSet" media/test/adaptive/dash/manifest.mpd
          python - <<'PY'
          import json
          d=json.load(open("media/test/adaptive/package_manifest.json"))
          assert d["variants"] == ["mobile_saver","mobile","standard"]
          assert d["deployment_active"] is False
          from pathlib import Path
          root = Path("media/test/adaptive/hls")
          sizes = {}
          for name in ("mobile_saver", "mobile", "standard"):
              segs = sorted((root / name).glob("seg_*.ts"))
              assert segs
              assert all(p.stat().st_size > 0 for p in segs)
              sizes[name] = sum(p.stat().st_size for p in segs)
          assert sizes["mobile_saver"] < sizes["mobile"] < sizes["standard"]
          print("ADAPTIVE HLS/DASH DATA USAGE INTEGRITY: PASS", sizes)
          PY
