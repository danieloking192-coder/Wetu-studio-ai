name: WETU Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify WETU Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/kotlin/ai/wetu/studio/MainActivity.kt
          test -s app/src/main/assets/creator_studio.html

      - name: Verify Creator Studio contract
        run: |
          grep -q "WETU" app/src/main/assets/creator_studio.html
          grep -q "Donne vie à ton histoire" app/src/main/assets/creator_studio.html
          grep -q 'value="lua"' app/src/main/assets/creator_studio.html
          grep -q "Tshiluba" app/src/main/assets/creator_studio.html
          grep -q "480p" app/src/main/assets/creator_studio.html
          grep -q "720p" app/src/main/assets/creator_studio.html
          grep -q "1080p" app/src/main/assets/creator_studio.html
          grep -q "file:///android_asset/creator_studio.html" app/src/main/kotlin/ai/wetu/studio/MainActivity.kt

      - name: Verify manifest contract
        run: |
          grep -q 'android:exported="true"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK integrity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Inspect APK contents
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q "assets/creator_studio.html"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wetu-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
