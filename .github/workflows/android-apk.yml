name: WETU Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, integrity and emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Creator Studio assets
        run: |
          test -s app/src/main/assets/creator_studio.html
          grep -q "WETU" app/src/main/assets/creator_studio.html
          grep -q "Tshiluba" app/src/main/assets/creator_studio.html
          grep -q "480p" app/src/main/assets/creator_studio.html
          grep -q "720p" app/src/main/assets/creator_studio.html
          grep -q "1080p" app/src/main/assets/creator_studio.html

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK integrity
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wetu-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop ai.wetu.studio.debug
            adb shell am start -n ai.wetu.studio.debug/ai.wetu.studio.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q "ai.wetu.studio.debug/ai.wetu.studio.MainActivity"
            adb shell pm path ai.wetu.studio.debug
            adb shell uiautomator dump /sdcard/wetu-ui.xml >/dev/null
            adb shell cat /sdcard/wetu-ui.xml | grep -q "Donne vie à ton histoire."
            adb shell settings get system screen_brightness
