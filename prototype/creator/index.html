<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WETU Creator</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#07090d;--panel:#0e1118;--panel2:#121620;--line:#202632;--text:#f5f7fb;--muted:#8e98aa;--accent:#8b5cf6;--accent2:#22d3ee;--good:#34d399;--warn:#fbbf24;--danger:#fb7185;--shadow:0 20px 60px rgba(0,0,0,.32)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,#1b1740 0,transparent 34%),radial-gradient(circle at 5% 35%,#09232d 0,transparent 28%),var(--bg);color:var(--text);min-height:100vh}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#151a24;color:var(--text);padding:9px 13px;border-radius:10px;transition:.18s ease}button:hover{transform:translateY(-1px);border-color:#3a4354;background:#1b2130}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:rgba(7,9,13,.78);backdrop-filter:blur(18px);padding:22px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:850;letter-spacing:-1px;padding:4px 8px 25px}.brand:before{content:"";width:13px;height:13px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 25px #8b5cf688}.workspace-label{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:#667085;padding:0 10px 8px}.nav{display:grid;gap:4px}.nav button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#aeb6c5;padding:11px 12px}.nav button.active{background:linear-gradient(90deg,#8b5cf61c,transparent);border-color:#8b5cf633;color:#fff}.side-footer{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b0e14}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px #34d39988;margin-right:7px}.main{width:100%;padding:24px 30px 50px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;color:#7d8799;text-transform:uppercase;letter-spacing:1.5px}.top h1{margin:4px 0 3px;font-size:30px;letter-spacing:-1.1px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions select{background:#10151e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:170px}.primary{background:linear-gradient(135deg,#7c3aed,#2563eb);border:0;box-shadow:0 8px 25px #4f46e533}.workspace{margin-top:22px}.hero{display:grid;grid-template-columns:1.6fr .8fr;gap:14px}.hero-card,.card{background:linear-gradient(180deg,rgba(18,22,32,.92),rgba(12,15,22,.92));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero-card{padding:24px}.hero-card h2{font-size:27px;margin:8px 0}.muted{color:var(--muted)}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.metric{padding:14px;border:1px solid var(--line);border-radius:13px;background:#0a0d13}.metric b{display:block;font-size:22px;margin-top:4px}.metric span{font-size:11px;color:#778195}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.card{padding:18px}.card h3{margin:0 0 8px}.bar{height:5px;background:#202631;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#171d28;border:1px solid #283140;font-size:11px;margin:4px 4px 0 0;color:#aeb7c6}.timeline{display:flex;gap:10px;overflow:auto;padding-bottom:3px}.shot{min-width:165px;height:100px;border:1px solid #293140;background:linear-gradient(135deg,#171d29,#0c1017);border-radius:13px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{background:#090c12;color:inherit;border:1px solid #293140;border-radius:10px;padding:10px}.result{white-space:pre-wrap;word-break:break-word;font-size:12px}.badge{padding:5px 8px;border-radius:8px;background:#10231d;color:#67e8b2;font-size:11px}.command{display:flex;gap:7px;flex-wrap:wrap}.command button{font-size:12px}@media(max-width:1050px){.app{grid-template-columns:190px 1fr}.hero{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:18px}.top{display:block}.actions{margin-top:15px;justify-content:flex-start}.grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">WETU</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Project</h1><div class="muted" id="subtitle">Production workspace</div></div><div class="actions"><select id="projectSelect" onchange="switchProject(this.value)"><option>Loading projects…</option></select><button onclick="newProject()">New Project</button><button onclick="loadState()">Refresh</button><button onclick="demoFlow()">Run demo</button><button onclick="createScene()">New scene</button><button onclick="exportState()">Export JSON</button><button onclick="mediaGenerate()">Generate Media</button><button onclick="validateScene()">Validate Scene</button><button onclick="runProduction()">Run Production</button><button onclick="fanFilmSetup()">Fan Film</button><button onclick="originalSetup()">Original Universe</button><button onclick="animationRequest()">Animation</button></div></div><section class="workspace" id="workspace"></section></main></div>
<script>
const tabs=["Project","Characters","World / City","Script","Storyboard","Generate","Audio","Timeline","QA","Export"];
const nav=document.querySelector("#nav"),ws=document.querySelector("#workspace"),title=document.querySelector("#title"),sub=document.querySelector("#subtitle");
const data={Project:["Project state","Production memory","Versions"],Characters:["Character DNA","Identity","Wardrobe & Voice"],"World / City":["World DNA","City","Architecture & Landmarks"],Script:["Scenes","Dialogues","Languages"],Storyboard:["Shots","Camera","References"],Generate:["Provider","Model","Generation context"],Audio:["Character voices","Dubbing","Subtitles"],Timeline:["Scenes","Audio","Cuts"],QA:["Continuity Guard","Realism QA","Issues"],Export:["Format","Resolution","Publishing"]};
tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>render(t,b);nav.appendChild(b);if(i===0)render(t,b)});
function render(t,b){
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 title.innerHTML='<span class="eyebrow">WETU Studio</span>'+t;
 sub.textContent=data[t][0]+" · live production intelligence";
 const s=window.lastState||{};
 const metrics=[["Characters",s.characters?.length||0],["Worlds",s.worlds?.length||0],["Scenes",s.scenes?.length||0],["Generations",s.generations?.length||0]];
 const cards=data[t].map((x,i)=>'<div class="card"><div class="section-head"><h3>'+x+'</h3><span class="badge">LIVE</span></div><p class="muted">'+description(t,i)+'</p><div class="bar"><i style="width:'+([92,78,68][i%3])+'%"></i></div><div><span class="pill">Persistent</span><span class="pill">Memory-linked</span></div></div>').join("");
 ws.innerHTML='<div class="hero"><div class="hero-card"><span class="eyebrow">Production intelligence</span><h2>'+((s.project_id||"WETU Production"))+'</h2><p class="muted">One universe. Persistent identity. Continuous memory. Every creative decision remains traceable across the production.</p><div class="metric-grid">'+metrics.map(m=>'<div class="metric"><span>'+m[0]+'</span><b>'+m[1]+'</b></div>').join("")+'</div></div><div class="hero-card"><span class="eyebrow">Continuity status</span><h2>Production ready</h2><p class="muted">Character DNA · World DNA · Scene Memory · QA</p><div class="command"><button class="primary" onclick="runProduction()">Run production</button><button onclick="validateScene()">Validate</button><button onclick="mediaGenerate()">Generate</button></div></div></div><div class="grid">'+cards+'</div><div class="card" style="margin-top:14px"><div class="section-head"><div><h3>Scene Memory</h3><span class="muted">Context follows the production automatically.</span></div><span class="pill">'+(s.scenes?.length||0)+' scenes</span></div><div class="timeline">'+(s.scenes?.length?s.scenes.map((x,i)=>'<div class="shot"><b>Scene '+String(i+1).padStart(2,"0")+'</b><span class="muted">'+(x.state?.shot||"Context ready")+'</span><span class="pill">'+(x.language||"—")+'</span></div>').join(""):'<div class="shot">No scenes yet<br><span class="muted">Create your first scene</span></div>')+'</div></div>';
}>
