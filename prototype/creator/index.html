<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WETU Creator</title>
<style>
:root{font-family:Inter,system-ui,sans-serif}body{margin:0;background:#101114;color:#f4f4f5}button{cursor:pointer;border:1px solid #333;background:#191b20;color:inherit;padding:10px 14px;border-radius:9px}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid #292b31;padding:20px}.brand{font-size:24px;font-weight:800;margin-bottom:24px}.nav button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent}.nav button.active{background:#272a31}.main{padding:28px;max-width:1300px;width:calc(100% - 56px)}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.card{background:#17191e;border:1px solid #292b31;border-radius:14px;padding:18px}.muted{color:#a1a1aa}.bar{height:8px;background:#292b31;border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;width:76%;background:#e5e7eb}.workspace{margin-top:24px}.timeline{display:flex;gap:6px;overflow:auto}.shot{min-width:150px;height:90px;background:#23262d;border-radius:10px;padding:10px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#272a31;font-size:12px;margin:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}
 .form{display:grid;gap:10px}.form input,.form select,.form textarea{background:#0f1115;color:inherit;border:1px solid #333;border-radius:9px;padding:10px}.result{white-space:pre-wrap;word-break:break-word} </style></head><body><div class="app"><aside class="side"><div class="brand">WETU</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Project</h1><div class="muted" id="subtitle">Production workspace</div></div><div class="actions"><button onclick="loadState()">Refresh</button><button onclick="demoFlow()">Run demo</button><button onclick="createScene()">New scene</button><button onclick="exportState()">Export JSON</button><button onclick="mediaGenerate()">Generate Media</button></div></div><section class="workspace" id="workspace"></section></main></div>
<script>
const tabs=["Project","Characters","World / City","Script","Storyboard","Generate","Audio","Timeline","QA","Export"];
const nav=document.querySelector("#nav"),ws=document.querySelector("#workspace"),title=document.querySelector("#title"),sub=document.querySelector("#subtitle");
const data={Project:["Project state","Production memory","Versions"],Characters:["Character DNA","Identity","Wardrobe & Voice"],"World / City":["World DNA","City","Architecture & Landmarks"],Script:["Scenes","Dialogues","Languages"],Storyboard:["Shots","Camera","References"],Generate:["Provider","Model","Generation context"],Audio:["Character voices","Dubbing","Subtitles"],Timeline:["Scenes","Audio","Cuts"],QA:["Continuity Guard","Realism QA","Issues"],Export:["Format","Resolution","Publishing"]};
tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>render(t,b);nav.appendChild(b);if(i===0)render(t,b)});
function render(t,b){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");title.textContent=t;sub.textContent=data[t][0]+" · shared production state";ws.innerHTML='<div class="grid">'+data[t].map((x,i)=>'<div class="card"><h3>'+x+'</h3><p class="muted">'+description(t,i)+'</p><div class="bar"><i style="width:'+([86,72,64][i%3])+'%"></i></div><br><span class="pill">Persistent</span><span class="pill">Memory-linked</span></div>').join("")+'</div><div class="card" style="margin-top:14px"><h3>Production Memory</h3><p class="muted">Context is carried automatically between workspaces. Accepted and rejected generations remain traceable.</p><div class="timeline">'+["Scene 01","Scene 02","Scene 03","Scene 04","Scene 05"].map(x=>'<div class="shot">'+x+'<br><span class="muted">Context ready</span></div>').join("")+'</div></div>'}
async function api(path, body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.json()}
async function loadState(){const r=await fetch("/api/state");const s=await r.json();sub.textContent="Project "+s.project_id+" · "+s.characters.length+" characters · "+s.worlds.length+" worlds · "+s.scenes.length+" scenes · "+s.generations.length+" generations";return s}
async function mediaGenerate(){
  const sceneId=(await loadState()).scenes[0]?.scene_id;
  if(!sceneId){ws.insertAdjacentHTML("afterbegin",`<div class="card"><h3>No scene</h3><p class="muted">Create or run the demo first.</p></div>`);return}
  ws.insertAdjacentHTML("afterbegin",`<div class="card"><h3>Media Generation</h3><div class="form"><select id="mk"><option>image</option><option>video</option><option>audio</option></select><select id="mp"><option>wetu-local</option></select><textarea id="mPrompt" rows="3">Cinematic production asset using the current Character DNA, World DNA and Scene Memory.</textarea><button onclick="runMedia()">Generate</button><div id="mediaResult" class="result muted"></div></div></div>`);
}
async function runMedia(){
 const s=await loadState(), sceneId=s.scenes[0]?.scene_id;
 const body={request_id:"media-"+Date.now(),scene_id:sceneId,kind:document.querySelector("#mk").value,provider:document.querySelector("#mp").value,prompt:document.querySelector("#mPrompt").value,references:[],options:{}};
 const r=await api("/api/media",body);document.querySelector("#mediaResult").textContent=JSON.stringify(r,null,2);loadState();
}
async function demoFlow(){
  try{
    await api("/api/characters",{character_id:"amina",name:"Amina",face:{identity:"persistent"},wardrobe:{outfit:"blue dress"},traits:["calm","determined"]});
    await api("/api/worlds",{world_id:"kinshasa",name:"Kinshasa",geography:{city:"Kinshasa"},architecture:{style:"urban"},landmarks:["city streets"]});
    await api("/api/scenes",{scene_id:"scene-01",project_id:"demo",sequence:1,character_ids:["amina"],world_id:"kinshasa",language:"fr",state:{shot:"wide cinematic"}});
    const g=await api("/api/generate",{scene_id:"scene-01",provider:"wetu-demo",kind:"image",prompt:"A cinematic street scene in Kinshasa with Amina.",generation_id:"gen-"+Date.now()});
    const s=await loadState(); ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>Live Creator Core</h3><p class="muted">Generation: '+g.status+' · QA: '+(g.qa?.passed?"PASS":"BLOCKED")+'</p><span class="pill">Character DNA</span><span class="pill">World DNA</span><span class="pill">Scene Memory</span><span class="pill">Production Memory</span></div>');
  }catch(e){ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>API error</h3><p class="muted">'+e.message+'</p></div>')}
}
loadState().catch(()=>{});
function description(t,i){const d={Characters:["Persistent identity for face, body, hair, eyes, wardrobe and voice.","Reference consistency and version history.","Reusable wardrobe and voice profile."],"World / City":["Persistent world identity.","Cities, neighborhoods and locations.","Architecture, materials and landmarks."],QA:["Checks identity and continuity before/after generation.","Checks anatomy, materials, light, camera and motion.","Structured findings before export."]};return (d[t]||["Shared project state and workflow control.","Linked production information.","Traceable versions and decisions."])[i]}
async function createScene(){const id="scene-"+Date.now();const body={scene_id:id,project_id:"demo",sequence:Date.now(),character_ids:["amina"],world_id:"kinshasa",language:"fr",state:{shot:"cinematic"}};const r=await api("/api/scenes",body);ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>Scene created</h3><p class="muted">'+id+' · '+(r.ok?"ready":"error")+'</p></div>');loadState()}
async function exportState(){const s=await loadState();const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wetu-production-state.json";a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
