<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><link rel="manifest" href="/manifest.webmanifest"><title>WETU Creator</title>
<style>
.empty{min-height:170px;display:flex;flex-direction:column;justify-content:center}.security-note{font-size:11px;color:var(--muted)}
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#07090d;--panel:#0e1118;--panel2:#121620;--line:#202632;--text:#f5f7fb;--muted:#8e98aa;--accent:#8b5cf6;--accent2:#22d3ee;--good:#34d399;--warn:#fbbf24;--danger:#fb7185;--shadow:0 20px 60px rgba(0,0,0,.32)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,#1b1740 0,transparent 34%),radial-gradient(circle at 5% 35%,#09232d 0,transparent 28%),var(--bg);color:var(--text);min-height:100vh}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#151a24;color:var(--text);padding:9px 13px;border-radius:10px;transition:.18s ease}button:hover{transform:translateY(-1px);border-color:#3a4354;background:#1b2130}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:rgba(7,9,13,.78);backdrop-filter:blur(18px);padding:22px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:850;letter-spacing:-1px;padding:4px 8px 25px}.brand:before{content:"";width:13px;height:13px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 25px #8b5cf688}.workspace-label{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:#667085;padding:0 10px 8px}.nav{display:grid;gap:4px}.nav button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#aeb6c5;padding:11px 12px}.nav button.active{background:linear-gradient(90deg,#8b5cf61c,transparent);border-color:#8b5cf633;color:#fff}.side-footer{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b0e14}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px #34d39988;margin-right:7px}.main{width:100%;padding:24px 30px 50px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;color:#7d8799;text-transform:uppercase;letter-spacing:1.5px}.top h1{margin:4px 0 3px;font-size:30px;letter-spacing:-1.1px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions select{background:#10151e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:170px}.primary{background:linear-gradient(135deg,#7c3aed,#2563eb);border:0;box-shadow:0 8px 25px #4f46e533}.workspace{margin-top:22px}.hero{display:grid;grid-template-columns:1.6fr .8fr;gap:14px}.hero-card,.card{background:linear-gradient(180deg,rgba(18,22,32,.92),rgba(12,15,22,.92));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero-card{padding:24px}.hero-card h2{font-size:27px;margin:8px 0}.muted{color:var(--muted)}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.metric{padding:14px;border:1px solid var(--line);border-radius:13px;background:#0a0d13}.metric b{display:block;font-size:22px;margin-top:4px}.metric span{font-size:11px;color:#778195}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.card{padding:18px}.card h3{margin:0 0 8px}.bar{height:5px;background:#202631;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#171d28;border:1px solid #283140;font-size:11px;margin:4px 4px 0 0;color:#aeb7c6}.timeline{display:flex;gap:10px;overflow:auto;padding-bottom:3px}.shot{min-width:165px;height:100px;border:1px solid #293140;background:linear-gradient(135deg,#171d29,#0c1017);border-radius:13px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{background:#090c12;color:inherit;border:1px solid #293140;border-radius:10px;padding:10px}.result{white-space:pre-wrap;word-break:break-word;font-size:12px}.badge{padding:5px 8px;border-radius:8px;background:#10231d;color:#67e8b2;font-size:11px}.command{display:flex;gap:7px;flex-wrap:wrap}.command button{font-size:12px}@media(max-width:1050px){.app{grid-template-columns:190px 1fr}.hero{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:18px}.top{display:block}.actions{margin-top:15px;justify-content:flex-start}.grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">WETU</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Project</h1><div class="muted" id="subtitle">Production workspace</div></div><div class="actions"><select id="projectSelect" onchange="switchProject(this.value)"><option>Loading projects…</option></select><button onclick="newProject()">New Project</button><button onclick="loadState()">Refresh</button><button onclick="demoFlow()">Run demo</button><button onclick="createScene()">New scene</button><button onclick="exportState()">Export JSON</button><button onclick="mediaGenerate()">Generate Media</button><button onclick="validateScene()">Validate Scene</button><button onclick="runProduction()">Run Production</button><button onclick="fanFilmSetup()">Fan Film</button><button onclick="originalSetup()">Original Universe</button><button onclick="animationRequest()">Animation</button></div></div><section class="workspace" id="workspace"></section></main></div>
<script>
const tabs=["Project","Characters","World / City","Script","Storyboard","Generate","Audio","Timeline","QA","Export"];
const nav=document.querySelector("#nav"),ws=document.querySelector("#workspace"),title=document.querySelector("#title"),sub=document.querySelector("#subtitle");
const data={Project:["Project state","Production memory","Versions"],Characters:["Character DNA","Identity","Wardrobe & Voice"],"World / City":["World DNA","City","Architecture & Landmarks"],Script:["Scenes","Dialogues","Languages"],Storyboard:["Shots","Camera","References"],Generate:["Provider","Model","Generation context"],Audio:["Character voices","Dubbing","Subtitles"],Timeline:["Scenes","Audio","Cuts"],QA:["Continuity Guard","Realism QA","Issues"],Export:["Format","Resolution","Publishing"]};
tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>render(t,b);nav.appendChild(b);if(i===0)render(t,b)});
function esc(v){return String(v ?? "").replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]})}
function list(v){return Array.isArray(v)?v:[]}
function render(t,b){
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 const s=window.lastState||{}, chars=list(s.characters), worlds=list(s.worlds), scenes=list(s.scenes), gens=list(s.generations), events=list(s.events), refs=s.references||{};
 title.innerHTML='<span class="eyebrow">WETU Studio</span>'+esc(t);
 sub.textContent="Operational production intelligence · "+esc(s.project_id||"workspace");
 const metrics=[["Characters",chars.length],["Worlds",worlds.length],["Scenes",scenes.length],["Generations",gens.length]];
 const metricHtml=metrics.map(function(m){return '<div class="metric"><span>'+esc(m[0])+'</span><b>'+m[1]+'</b></div>'}).join("");
 function pills(items){return list(items).slice(0,8).map(function(x){return '<span class="pill">'+esc(typeof x==="string"?x:(x.id||x.type||JSON.stringify(x)))+'</span>'}).join("")}
 function charCard(x){return '<div class="card"><div class="section-head"><h3>'+esc(x.name||x.character_id)+'</h3><span class="badge">DNA</span></div><p class="muted">ID · '+esc(x.character_id)+'</p><div>'+pills(x.traits)+'</div><p class="muted">Face: '+esc((x.face&&x.face.identity)||"defined")+' · Hair: '+esc((x.hair&&x.hair.style)||"—")+'</p><p class="muted">Wardrobe: '+esc(JSON.stringify(x.wardrobe||{}))+'</p></div>'}
 function worldCard(x){return '<div class="card"><div class="section-head"><h3>'+esc(x.name||x.world_id)+'</h3><span class="badge">WORLD DNA</span></div><p class="muted">ID · '+esc(x.world_id)+'</p><p class="muted">Geography: '+esc(JSON.stringify(x.geography||{}))+'</p><p class="muted">Architecture: '+esc(JSON.stringify(x.architecture||{}))+'</p><div>'+pills(x.landmarks)+'</div></div>'}
 function sceneCard(x){return '<div class="card"><div class="section-head"><h3>Scene '+esc(x.sequence)+' · '+esc((x.state&&x.state.title)||x.scene_id)+'</h3><span class="badge">'+esc(x.language||"—")+'</span></div><p class="muted">'+esc((x.state&&x.state.summary)||"Persistent scene context")+'</p><div>'+pills(x.character_ids)+'</div><p class="muted">World · '+esc(x.world_id||"—")+'</p></div>'}
 function genCard(x){return '<div class="card"><div class="section-head"><h3>'+esc(x.generation_id||"Generation")+'</h3><span class="badge">'+esc(x.status||"recorded")+'</span></div><p class="muted">Provider · '+esc(x.provider||"—")+' · Kind · '+esc(x.kind||"—")+'</p><p class="muted">Scene · '+esc(x.scene_id||"—")+'</p></div>'}
 let body="";
 if(t==="Characters") body=chars.length?chars.map(charCard).join(""):'<div class="card empty"><h3>No Character DNA</h3><p class="muted">Create a character or run the demo to initialize persistent identity.</p></div>';
 else if(t==="World / City") body=worlds.length?worlds.map(worldCard).join(""):'<div class="card empty"><h3>No World DNA</h3><p class="muted">Create a world/city to establish persistent geography and architecture.</p></div>';
 else if(t==="Script") body=scenes.length?scenes.sort(function(a,b){return (a.sequence||0)-(b.sequence||0)}).map(sceneCard).join(""):'<div class="card empty"><h3>Script layer empty</h3><p class="muted">Scenes become the durable script/scene-memory spine.</p></div>';
 else if(t==="Storyboard") body=scenes.map(sceneCard).join("")||'<div class="card empty"><h3>No storyboard scenes</h3><p class="muted">Create scenes, then generate shots from their memory.</p></div>';
 else if(t==="Generate") body='<div class="card"><div class="section-head"><h3>Provider Registry</h3><span class="badge">PROVIDER-NEUTRAL</span></div><p class="muted">Connected provider profiles are exposed by the API. Local WETU assets remain deterministic manifests until a real provider is configured.</p><div class="command"><button class="primary" onclick="mediaGenerate()">Generate Media</button><button onclick="runProduction()">Run Production</button></div></div><div class="card"><h3>Generation History</h3>'+ (gens.length?gens.map(genCard).join(""):'<p class="muted">No generation records yet.</p>')+'</div>';
 else if(t==="Timeline") body='<div class="card"><h3>Production Timeline</h3><div class="timeline">'+(scenes.length?scenes.sort(function(a,b){return (a.sequence||0)-(b.sequence||0)}).map(function(x,i){return '<div class="shot"><b>'+String(i+1).padStart(2,"0")+' · '+esc(x.scene_id)+'</b><span class="muted">'+esc((x.state&&x.state.title)||"Scene")+'</span><span class="pill">'+esc(x.language||"—")+'</span></div>'}).join(""):'<div class="shot">No scenes</div>')+'</div></div>';
 else if(t==="QA") body='<div class="card"><div class="section-head"><h3>Continuity & Realism Gate</h3><span class="badge">ON-DEMAND</span></div><p class="muted">Validation is executed against the active scene. WETU does not display a PASS until the validator actually returns one.</p><button class="primary" onclick="validateScene()">Validate active scene</button></div><div class="card"><h3>Audit Memory</h3><p class="muted">'+events.length+' recorded events · '+Object.keys(refs).length+' reference groups.</p></div>';
 else if(t==="Audio") body='<div class="card"><div class="section-head"><h3>Audio & Subtitles</h3><span class="badge">'+(s.subtitles_enabled?"SUBTITLES ON":"SUBTITLES OFF")+'</span></div><p class="muted">Les sous-titres sont une option de production explicite. Ils ne sont jamais activés automatiquement.</p><div class="command"><button class="primary" onclick="toggleSubtitles()">'+(s.subtitles_enabled?"Disable subtitles":"Enable subtitles")+'</button></div></div><div class="card"><div class="section-head"><h3>Dialogue ↔ Voice ↔ Subtitles</h3><span class="badge">SYNC READY</span></div><p class="muted">Le moteur de synchronisation conserve les mêmes timecodes et le lien entre chaque ligne de dialogue, sa voix et son sous-titre. La synchronisation est validée avant intégration au montage.</p><div><span class="pill">Dialogue timecode</span><span class="pill">Voice request ID</span><span class="pill">Subtitle cue</span><span class="pill">Language</span></div></div>';else if(t==="Export") body='<div class="card"><h3>Production Export</h3><p class="muted">Export the complete active project state, including persistent identity, world, scenes and recorded generations.</p><button class="primary" onclick="exportState()">Export JSON</button></div>';
 else body='<div class="card"><div class="section-head"><h3>Project Control</h3><span class="badge">PERSISTENT</span></div><p class="muted">Project '+esc(s.project_id||"—")+' · universe '+esc((s.universe&&s.universe.mode)||"original")+'</p><div>'+pills(["Character DNA","World DNA","Scene Memory","Production Memory","Continuity Guard"])+'</div></div><div class="card"><h3>Recent Production Events</h3><p class="muted">'+esc(events.length)+" events retained in the active state."+'</p></div>';
 ws.innerHTML='<div class="hero"><div class="hero-card"><span class="eyebrow">Production intelligence</span><h2>'+esc(s.project_id||"WETU Production")+'</h2><p class="muted">WETU mémorise la production, pas seulement le prompt. Identity, world, scenes, decisions and generation history remain linked.</p><div class="metric-grid">'+metricHtml+'</div></div><div class="hero-card"><span class="eyebrow">Security posture</span><h2>Protected workflow</h2><p class="muted">Request limits · secure headers · isolated project state · bounded payloads · optional bearer authentication.</p><div class="command"><button class="primary" onclick="runProduction()">Run production</button><button onclick="validateScene()">Validate</button></div></div></div><div class="grid">'+body+'</div>';
}

async function loadProjects(){
 const r=await fetch("/api/projects"); const data=await r.json(); const sel=document.querySelector("#projectSelect");
 sel.innerHTML=(data.projects||[]).map(p=>'<option value="'+p.project_id+'" '+(p.project_id===data.active_project_id?'selected':'')+'>'+p.title+'</option>').join("");
 return data;
}
async function switchProject(projectId){
 if(!projectId)return;
 const r=await api("/api/projects/switch",{project_id:projectId});
 if(!r.ok){alert(r.error||"Unable to switch project");return}
 await loadProjects(); await loadState();
 ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>Project switched</h3><p class="muted">Active workspace: '+projectId+'</p></div>');
}
async function newProject(){
 const titleValue=prompt("Project name");
 if(!titleValue)return;
 const projectId=titleValue.toLowerCase().trim().replace(/[^a-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"");
 if(!projectId){alert("Invalid project name");return}
 const r=await api("/api/projects/create",{project_id:projectId,title:titleValue});
 if(!r.ok){alert(r.error||"Unable to create project");return}
 await loadProjects(); await loadState();
 ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>New WETU project</h3><p class="muted">'+titleValue+' · isolated production memory ready.</p><span class="pill">Character DNA</span><span class="pill">World DNA</span><span class="pill">Scene Memory</span><span class="pill">Production Memory</span></div>');
}

async function toggleSubtitles(){ const s=await loadState(); const r=await api("/api/subtitles/settings",{enabled:!s.subtitles_enabled}); if(!r.ok){alert(r.error||"Unable to change subtitle setting");return} await loadState(); render("Audio",document.querySelector(".nav button:nth-child(7)")); }
async function api(path, body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.json()}
async function loadState(){const r=await fetch("/api/state");const s=await r.json();window.lastState=s;sub.textContent="Project "+s.project_id+" · "+s.characters.length+" characters · "+s.worlds.length+" worlds · "+s.scenes.length+" scenes · "+s.generations.length+" generations · Mode: "+(s.universe?.mode||"original");return s}
async function fanFilmSetup(){
 const refs=[
  {character_id:"naruto-uzumaki",display_name:"Naruto Uzumaki",source_work:"Naruto Shippuden"},
  {character_id:"sasuke-uchiha",display_name:"Sasuke Uchiha",source_work:"Naruto Shippuden"},
  {character_id:"sakura-haruno",display_name:"Sakura Haruno",source_work:"Naruto Shippuden"},
  {character_id:"kakashi-hatake",display_name:"Kakashi Hatake",source_work:"Naruto Shippuden"}];
 const r=await api("/api/universe",{production_id:"naruto-short-001",title:"Naruto Shippuden — WETU Fan Short",mode:"fan_film",character_references:refs});
 ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>FAN FILM</h3><p class="muted">4 personnages référencés · provenance enregistrée · univers original isolé.</p></div>'); loadState();
}
async function originalSetup(){
 const r=await api("/api/universe",{production_id:"wetu-original-001",title:"WETU Original Universe",mode:"original",original_universe_id:"universe-wetu-001"});
 ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>ORIGINAL UNIVERSE</h3><p class="muted">Univers WETU indépendant · prêt pour personnages, clans, pouvoirs, villes, saisons et épisodes.</p></div>'); loadState();
}
async function animationRequest(){
 const s=await loadState(), sceneId=s.scenes[0]?.scene_id||"scene-01";
 const body={request_id:"anim-"+Date.now(),project_id:s.project_id,scene_id:sceneId,style:{style_id:"wetu-anime-cinematic",medium:"anime",visual_language:"original shonen-inspired visual language",camera_language:"dynamic cinematic framing",motion_language:"expressive combat motion",lighting_language:"dramatic volumetric light",notes:{universe_mode:s.universe?.mode||"original"}},prompt:"Animated cinematic scene using the current production memory.",references:[],options:{fps:24}};
 const r=await api("/api/animation",body);
 ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>Animation Request</h3><div class="result muted">'+JSON.stringify(r,null,2)+'</div></div>');
}
async function loadProviders(){
 try{
   const r=await api("/api/providers",{});
   window.providerProfiles=Array.isArray(r.providers)?r.providers:[];
   return window.providerProfiles;
 }catch(e){window.providerProfiles=[];return []}
}
function providerOptions(kind){
 const profiles=window.providerProfiles||[];
 const compatible=profiles.filter(p=>!p.capabilities||p.capabilities.includes(kind));
 if(!compatible.length)return '<option value="auto">auto (no configured provider)</option>';
 return compatible.map(p=>{
   const real=p.real_media===true||p.real_audio===true;
   const label=(p.name||"provider")+(real?" · REAL":" · manifest");
   return '<option value="'+esc(p.name||"auto")+'">'+esc(label)+'</option>';
 }).join("");
}
async function mediaGenerate(){
  const sceneId=(await loadState()).scenes[0]?.scene_id;
  if(!sceneId){ws.insertAdjacentHTML("afterbegin",`<div class="card"><h3>No scene</h3><p class="muted">Create or run the demo first.</p></div>`);return}
  await loadProviders();
  ws.insertAdjacentHTML("afterbegin",`<div class="card"><h3>Media Generation</h3><p class="muted">WETU chooses only providers exposed by the server. Real AI providers appear here automatically when credentials and capabilities are configured; no provider is hard-coded into the interface.</p><div class="form"><select id="mk" onchange="refreshProviderChoices()"><option>image</option><option>video</option><option>audio</option></select><select id="mp">${providerOptions("image")}</select><textarea id="mPrompt" rows="3">Cinematic production asset using the current Character DNA, World DNA and Scene Memory.</textarea><button class="primary" onclick="runMedia()">Generate</button><div id="mediaResult" class="result muted"></div></div></div>`);
}
function refreshProviderChoices(){
 const kind=document.querySelector("#mk")?.value||"image";
 const select=document.querySelector("#mp");
 if(select)select.innerHTML=providerOptions(kind);
}
async function runMedia(){
 const s=await loadState(), sceneId=s.scenes[0]?.scene_id;
 const body={request_id:"media-"+Date.now(),scene_id:sceneId,kind:document.querySelector("#mk").value,provider:document.querySelector("#mp").value,prompt:document.querySelector("#mPrompt").value,references:[],options:{}};
 const r=await api("/api/media-generate",body);document.querySelector("#mediaResult").textContent=JSON.stringify(r,null,2);loadState();
}
async function runProduction(){
 const s=await loadState();
 if(!s.scenes.length||!s.characters.length||!s.worlds.length){
   ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>Production blocked</h3><p class="muted">Character DNA, World DNA and at least one Scene are required.</p></div>'); return;
 }
 const characters=s.characters, world=s.worlds[0];
 const scenes=s.scenes.map(x=>({scene_id:x.scene_id,project_id:x.project_id,sequence:x.sequence,character_ids:x.character_ids,world_id:x.world_id,language:x.language,state:x.state}));
 const brief="Produce the current WETU project using persistent Character DNA, World DNA, Scene Memory and Production Memory.";
 try{
   const plan=await api("/api/creative-plan",{project_id:s.project_id,brief,characters,world,scenes,production_memory:{events:s.events,generations:s.generations,decisions:s.decisions,references:s.references},default_mood:"natural"});
   if(!plan.ok){throw new Error(JSON.stringify(plan.issues||plan));}
   const produced=await api("/api/produce",{project_id:s.project_id,brief,characters,world,scenes,production_memory:{events:s.events,generations:s.generations},provider:"auto",kind:"image",default_mood:"natural",references:[],options:{}});
   ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>Production Orchestrator</h3><p class="muted">Plan: READY · Production: '+(produced.ok?"READY":"BLOCKED")+'</p><div class="result muted">'+JSON.stringify({plan:plan.plan,production:produced.production},null,2)+'</div></div>');
   loadState();
 }catch(e){ws.insertAdjacentHTML("afterbegin",'<div class="card"><h3>Production blocked</h3><p class="muted">'+e.message+'</p></div>')}
}
async function validateScene(){
 const s=await loadState(), sceneId=s.scenes[0]?.scene_id;
 if(!sceneId){ws.insertAdjacentHTML("afterbegin",`<div class="card"><h3>No scene</h3><p class="muted">Create or run the demo first.</p></div>`);return}
 const r=await api("/api/production-realism",{scene_id:sceneId,mood:"natural",emotional_beats:[],atmosphere:{},sensory_focus:[],camera_guidance:[]});
 ws.insertAdjacentHTML("afterbegin",`<div class="card"><h3>Realism & Continuity Validation</h3><p class="muted">${r.ok?"PASS":"BLOCKED"} · ${r.issues?.length||0} issue(s)</p><div class="result muted">${JSON.stringify(r.issues||[],null,2)}</div></div>`);
}
async function demoFlow(){
  try{
    await api("/api/characters",{character_id:"amina",name:"Amina",face:{identity:"persistent"},wardrobe:{outfit:"blue dress"},traits:["calm","determined"]});
    await api("/api/worlds",{world_id:"kinshasa",name:"Kinshasa",geography:{city:"Kinshasa"},architecture:{style:"urban"},landmarks:["city streets"]});
